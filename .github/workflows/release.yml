name: release

# Publishes @billionsend/cli at the version package.json declares, to npm via
# Trusted Publishing (OIDC): no token is stored. Run it by hand (Actions →
# release → Run workflow) on a version tag. npm accepts a Trusted Publisher only
# on a package that already exists, so the very first version is published by a
# maintainer from a checkout; see "Releasing" in the README.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only a tag that names the manifest's version publishes, so the number on
      # npm is always a commit you can find.
      - name: Run from the tag of the manifest version
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tests drive the built bundle end to end against the contract API;
      # a green run here is the gate before anything reaches npm.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # npm ≥ 11.5.1 exchanges the OIDC token itself; publish runs
      # prepublishOnly (esbuild bundle).
      - run: npm install -g npm@11.8.0
      - run: npm publish
